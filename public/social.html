<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Review your posts</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/hub.css">
  <style>
    .sr { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 16px; }
    .sr-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .sr-head img { height: 28px; width: auto; }
    .sr-hero { background: #0F1B17; color: #fff; border-radius: var(--r); padding: 22px 20px; }
    @media (prefers-color-scheme: dark) { .sr-hero { background: #14251F; border: 1px solid var(--line); } }
    .sr-hero .eyebrow { color: #9DEBCB; }
    .sr-hero h1 { color: #fff; margin: 4px 0 2px; overflow-wrap: anywhere; }
    .sr-hero p { color: #CFE9DD; margin: 0; }
    .sr-sec h2 { margin: 6px 0 0; }
    .sr-post { display: grid; gap: 12px; min-width: 0; }
    .sr-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .sr-top .item-title { overflow-wrap: anywhere; }
    .sr-media { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 8px; }
    .sr-media img, .sr-media video { width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px; display: block; background: var(--surface-2); }
    .sr-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .sr-tabs button { border: 1px solid var(--line); background: var(--surface); color: inherit; border-radius: 999px; padding: 6px 12px; font: 600 13px var(--body, sans-serif); cursor: pointer; }
    .sr-tabs button.is-on { background: var(--ink, #0F1B17); color: #fff; border-color: transparent; }
    .sr-cap { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .sr-cm { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
    .sr-cm.staff { border-color: var(--mint-strong, #23B07E); }
    .sr-cm p { margin: 2px 0 0; overflow-wrap: anywhere; }
    .sr-act { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
    .sr-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .sr-btns .btn { flex: 1 1 150px; }
    .sr-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .sr-cal .dow { font-size: 11px; color: var(--muted); text-align: center; }
    .sr-cal .d { min-height: 54px; border: 1px solid var(--line); border-radius: 8px; padding: 3px; font-size: 11px; display: grid; align-content: start; gap: 2px; background: var(--surface); }
    .sr-cal .d.out { opacity: .4; }
    .sr-cal .d a { display: block; background: var(--mint-soft); border-radius: 4px; padding: 1px 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: inherit; text-decoration: none; font-size: 10px; }
    @media (max-width: 520px) { .sr-cal .d { min-height: 44px; } .sr-cal .d a { font-size: 0; height: 6px; padding: 0; } }
  </style>
</head>
<body>
  <main class="sr" id="sr"><div class="card"><div class="skeleton"></div></div></main>
  <script type="module" src="/social.js"></script>
</body>
</html>
