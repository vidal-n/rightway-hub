<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Connect your Facebook and Instagram</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/hub.css">
  <style>
    .sr { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 16px; }
    .sr-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .sr-head img { height: 28px; width: auto; }
    .sr-hero { background: #0F1B17; color: #fff; border-radius: var(--r); padding: 22px 20px; }
    @media (prefers-color-scheme: dark) { .sr-hero { background: #14251F; border: 1px solid var(--line); } }
    .sr-hero .eyebrow { color: #9DEBCB; }
    .sr-hero h1 { color: #fff; margin: 4px 0 6px; overflow-wrap: anywhere; }
    .sr-hero p { color: #CFE9DD; margin: 0; }
    .cn-steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
    .cn-steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
    .cn-steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--mint, #9DEBCB); color: #0F1B17; font: 700 13px var(--body, sans-serif); display: grid; place-items: center; }
    .cn-do { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .cn-do li::before { content: "\2713\00a0"; color: var(--mint-strong, #23B07E); font-weight: 700; }
    .cn-go { display: grid; gap: 8px; }
    .cn-go .btn { width: 100%; justify-content: center; padding: 14px 16px; font-size: 16px; }
    .cn-ok { border-left: 4px solid var(--mint-strong, #23B07E); }
    .cn-warn { border-left: 4px solid #D9A400; }
    .cn-err { border-left: 4px solid #C0392B; }
    .cn-as { display: grid; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
    .cn-as li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .cn-code { font-family: 'JetBrains Mono', monospace; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: inline-block; user-select: all; }
    details.card summary { cursor: pointer; font-weight: 600; }
    details.card[open] summary { margin-bottom: 10px; }
    .cn-foot { text-align: center; }
  </style>
</head>
<body>
  <main class="sr" id="sr"><div class="card"><div class="skeleton"></div></div></main>
  <script type="module" src="/connect.js"></script>
</body>
</html>
