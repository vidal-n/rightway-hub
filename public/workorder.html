<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Service Agreement</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #F2F7F4; }
    main { max-width: 860px; margin: 0 auto; padding: 28px 16px 48px; }
    .bar { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 14px; font: 14px 'Instrument Sans', sans-serif; flex-wrap: wrap; align-items: center; }
    .bar label { display: flex; gap: 6px; align-items: center; }
    .bar input { width: 90px; padding: 8px 10px; border: 1px solid #DCE6E1; border-radius: 10px; font: inherit; }
    .bar button { background: #0F1B17; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font: 600 14px 'Instrument Sans', sans-serif; cursor: pointer; }
    @media print { body { background: #fff; } main { padding: 0; max-width: none; } .bar { display: none; } }
  </style>
</head>
<body>
  <main><div class="bar"><label><select id="kind" style="padding:8px 10px;border:1px solid #DCE6E1;border-radius:10px;font:inherit"><option value="seo">Local marketing agreement</option><option value="website">Website agreement</option></select></label><label><span id="sulabel">Buildout</span> $<input id="su" inputmode="decimal" placeholder="blank"></label><label>Monthly $<input id="mo" inputmode="decimal" placeholder="blank"></label><textarea id="scope" rows="3" placeholder="Website: what it includes, one item per line" style="display:none;width:100%;padding:8px 10px;border:1px solid #DCE6E1;border-radius:10px;font:inherit"></textarea><button onclick="print()">Print or save as PDF</button></div><div id="doc"></div></main>
  <script type="module">
    // Printable copy of the Rightway work orders (local marketing or website). Leave the amounts blank, or fill them in (also ?kind=website&setup=1500&monthly=49).
    import { agreementSections, agreementHtml, AGREEMENT_CSS, TITLES } from '/js/agreement.js';
    document.head.insertAdjacentHTML('beforeend', `<style>${AGREEMENT_CSS}</style>`);
    const q = new URLSearchParams(location.search);
    const su = document.getElementById('su'), mo = document.getElementById('mo'), kind = document.getElementById('kind'), scope = document.getElementById('scope');
    kind.value = q.get('kind') === 'website' ? 'website' : 'seo';
    su.value = q.get('setup') || ''; mo.value = q.get('monthly') || '';
    const cents = (v) => (String(v).trim() === '' || !Number.isFinite(Number(v)) ? null : Math.round(Number(v) * 100));
    const draw = () => {
      const setupCents = cents(su.value), monthlyCents = cents(mo.value), k = kind.value;
      scope.style.display = k === 'website' ? 'block' : 'none';
      document.getElementById('sulabel').textContent = k === 'website' ? 'Build fee' : 'Buildout';
      document.getElementById('doc').innerHTML = agreementHtml({ title: TITLES[k], sections: agreementSections({ kind: k, setupCents, monthlyCents, scope: scope.value }), logo: '<img src="/brand/rightway-logo-light.svg" alt="Rightway Growth" width="185" height="30">' });
    };
    [su, mo, scope].forEach((el) => el.addEventListener('input', draw)); kind.addEventListener('change', draw);
    draw();
  </script>
</body>
</html>
