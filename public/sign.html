<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Work Order</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/hub.css">
  <style>
    .wo { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 18px; }
    .wo-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .wo-head img { height: 30px; width: auto; }
    .price { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .price div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .price b { display: block; font: 700 26px var(--display); }
    .wo ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
    .signed { background: var(--mint-soft); border: 1px solid var(--mint-mid); border-radius: 16px; padding: 18px; }
    .sig { font: italic 600 30px Georgia, serif; }
    @media (max-width: 560px) { .price { grid-template-columns: 1fr; } }
    @media print { .no-print { display: none !important; } body { background: #fff; } .card { box-shadow: none; } }
  </style>
</head>
<body>
  <main class="wo" id="wo"><div class="skeleton"></div></main>
  <script type="module" src="/sign.js"></script>
</body>
</html>
