  <script>
    // iOS Home Screen app: the page box can end short of the real screen bottom (the home bar strip). Measure the gap so the Hub frame
    // can stretch over it and keep its controls clear of the home bar. The home bar itself is the system's; a web app cannot hide it.
    try {
      if (navigator.standalone) {
        var de = document.documentElement; de.classList.add('ios-standalone');
        var fit = function () {
          var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
          var gap = Math.round((innerWidth > innerHeight ? short : long) - innerHeight);
          if (gap < 0 || gap > 60) return;
          de.style.setProperty('--rw-gap', gap + 'px');
          de.style.setProperty('--sab', 'max(env(safe-area-inset-bottom, 0px), ' + gap + 'px)');
        };
        fit(); addEventListener('resize', fit); addEventListener('orientationchange', function () { setTimeout(fit, 300); });
      }
    } catch (e) {}
  </script>

  <div id="app"><div class="auth"><div class="spin" aria-label="Loading"></div></div></div>
  <noscript>Rightway Hub needs JavaScript turned on.</noscript>
  <script>
    // If the app has not drawn anything after 9 seconds, say why and offer a clean reload (clears old cached files).
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) { errs.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.replace(location.origin, '') + ')' : '')); }, true);
      window.addEventListener('unhandledrejection', function (e) { errs.push(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || !app.querySelector('.spin')) return;
        app.innerHTML = '<div class="auth"><div class="auth-card"><h1 style="font-size:26px">The Hub did not load</h1><p class="muted">Usually an old copy of the app saved in this browser. Press Fix and reload.</p>'
          + (errs.length ? '<pre style="white-space:pre-wrap;font-size:12px;background:#F2F7F4;color:#0F1B17;padding:10px;border-radius:10px">' + errs.slice(0, 4).join('\n').replace(/[<>&]/g, '') + '</pre>' : '')
          + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" id="fixrl">Fix and reload</button><button class="btn btn-ghost" id="sndrp">Report it</button></div></div></div>';
        document.getElementById('sndrp').onclick = function (ev) {
          var b = ev.currentTarget; b.disabled = true; b.textContent = 'Sending...';
          fetch('/api/crash', { method: 'POST', headers: { 'content-type': 'application/json', 'x-rw': '1' }, body: JSON.stringify({ message: 'The Hub did not load', stack: errs.slice(0, 6).join('\n'), where: location.hash + ' ' + location.pathname, ua: navigator.userAgent, extra: { online: navigator.onLine, sw: Boolean(navigator.serviceWorker && navigator.serviceWorker.controller) } }) })
            .then(function (r) { b.textContent = r.ok ? 'Sent. Thank you.' : 'Could not send'; }, function () { b.textContent = 'Could not send'; });
        };
        document.getElementById('fixrl').onclick = function () {
          var done = function () { location.replace('/?r=' + Date.now() + location.hash); };
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).then(done, done);
        };
      }, 9000);
    })();
  </script>
